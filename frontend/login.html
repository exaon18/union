<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · ASTRA HEALTH</title>
<meta name="description" content="ASTRA HEALTH - astronaut health monitoring and early-warning system (NASA Space Apps 2026 prototype).">
<meta name="theme-color" content="#04060c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%236fd3ff' stroke-width='3'/%3E%3Cpath d='M8 17h4l2-5 3 9 2-6h5' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preload" href="vendor/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="topnav"></header>
<main class="page" id="main">
<div class="login-wrap">
  <div class="panel login-card reveal">
    <div class="eyebrow">Secure crew access</div>
    <h1>Welcome aboard.</h1>
    <p class="lede" style="font-size:15px">Astronauts open their own health dashboard. Flight surgeons open the Mission Support Console.</p>
    <div class="denied" id="denied" hidden>That page needs a different role. Log in with the right account.</div>
    <form id="login-form" novalidate>
      <div class="field"><label for="username">Username</label><input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <div class="form-error" id="login-error" role="alert"></div>
      <button class="btn btn-primary btn-lg" id="login-btn" type="submit">Log in</button>
    </form>
    <div class="divider">Demo accounts · password astra2026</div>
    <div class="demo-accounts five" id="demo-accounts"></div>
  </div>
</div>
<div class="warp" id="warp"><b id="warp-text"></b></div>
</main>
<footer id="footer"></footer>
<script src="js/rules.js"></script>
<script src="js/scenarios.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
